services:
  app:
    build: .
    ports: ["18212:8000"]
    environment:
      DB_PATH: /data/loghour.db
      RULE_VERSION: "2026.11"
      ARCHIVE_DB_PATH: /data/archive.db
      COLD_ROOT: /data/cold
      HOT_QUOTA_BYTES: "1048576"
      COLD_QUOTA_BYTES: "4194304"
    volumes: ["app-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  app-data:
